<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>livesociya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="title">livesociya</div>
    <button class="logoutBtn" onclick="logout()">Logout</button>
  </header>

  <div class="container" id="login">
    <div class="card" style="margin-top: 40px; text-align: center;">
      <div style="font-size: 48px; margin-bottom: 16px; color: var(--primary);"><i class='bx bxs-bolt-circle'></i></div>
      <h2 style="font-size: 24px; margin-bottom:24px;">Welcome to livesociya</h2>
      <input id="name" placeholder="Enter username">
      <input id="password" type="password" placeholder="Password">
      <button onclick="login()">Continue <i class='bx bx-right-arrow-alt'></i></button>
    </div>
  </div>

  <div class="container hidden" id="home">

    <div id="eventsTab">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; display: flex; align-items: center; gap: 8px;"><i class='bx bx-bolt-circle' style="color: var(--primary);"></i> The Campus Feed</h3>
        <button onclick="openCreateModal()" style="width: auto; padding: 8px 16px; font-size: 13px; border-radius: 20px; box-shadow: var(--shadow-sm);">+ New Event</button>
      </div>
      <div id="events"></div>
    </div>

    <div id="recapTab" class="hidden">
      <h3 style="display: flex; align-items: center; gap: 8px;"><i class='bx bx-time-five' style="color: var(--primary);"></i> Campus Recap</h3>
      <p style="font-size: 14px; color: var(--text-muted); margin-top:-10px; margin-bottom:20px;">Everything that went down on campus in the last 24 hours.</p>
      <div id="recapEvents"></div>
    </div>

    <div id="chatsTab" class="hidden">
      <h3 style="display: flex; align-items: center; gap: 8px;"><i class='bx bx-message-square-dots' style="color: var(--primary);"></i> Messages</h3>
      <div style="display: flex; gap: 10px; margin-bottom: 24px;">
        <input id="chatUser" placeholder="Search exact username..." style="margin-bottom: 0;" />
        <button onclick="startChat()" style="width: auto; white-space: nowrap; padding: 0 20px;">Start</button>
      </div>
      <div id="chatList"></div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="showTab('events')">
        <i class='bx bx-bolt-circle'></i>
        <span>Live Now</span>
      </button>
      <button class="nav-item" onclick="showTab('recap')">
        <i class='bx bx-history'></i>
        <span>Recap</span>
      </button>
      <button class="nav-item" onclick="showTab('chats')" style="position: relative;">
        <div id="chatBadge" class="nav-badge hidden"></div>
        <i class='bx bx-message-rounded-dots'></i>
        <span>Chats</span>
      </button>
    </nav>

  </div>

  <div id="chatScreen" class="hidden">
    <div class="chat-header">
      <button class="back-btn" onclick="closeChat()"><i class='bx bx-left-arrow-alt'></i></button>
      <div class="chat-avatar" id="chatHeaderAvatar" style="width: 36px; height: 36px; font-size: 14px;">?</div>
      <div id="chatWithTitle" style="font-weight: 700; font-size: 18px;">User</div>
    </div>
    <div id="messages"></div>
    <div class="chat-footer">
      <input id="msgInput" placeholder="Message..." onkeypress="handleEnter(event)" />
      <button onclick="sendMessage()"><i class='bx bxs-send'></i></button>
    </div>
  </div>

  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div style="font-size: 40px; color: var(--primary); margin-bottom: 10px;"><i class='bx bx-slider-alt'></i></div>
      <h3 style="margin-top:0; font-size: 20px;">Manage Live Event</h3>
      <p style="font-size:14px; color: var(--text-muted); margin-bottom: 24px;">Are you wrapping up early or do you want to completely erase this broadcast?</p>
      <button onclick="confirmMoveToRecap()" style="background: var(--success);">Send to Campus Recap</button>
      <button onclick="confirmDeletePermanently()" style="background: var(--danger);">Delete Completely</button>
      <button onclick="closeDeleteModal()" style="background: #f3f4f6; color: var(--text);">Cancel</button>
    </div>
  </div>

  <div id="createModal" class="modal-overlay hidden">
    <div class="modal-content" style="text-align: left; max-width: 400px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 18px;">Broadcast Event</h3>
        <button onclick="closeCreateModal()" style="background: #f1f5f9; color: var(--text-muted); width: 32px; height: 32px; padding: 0; border-radius: 50%; font-size: 20px;"><i class='bx bx-x'></i></button>
      </div>
      
      <div class="tag-selector" id="tagSelector">
        <div class="tag active" onclick="selectTag(this, '☕ Chill')">☕ Chill</div>
        <div class="tag" onclick="selectTag(this, '🍕 Food')">🍕 Food</div>
        <div class="tag" onclick="selectTag(this, '🎉 Party')">🎉 Party</div>
        <div class="tag" onclick="selectTag(this, '📚 Study')">📚 Study</div>
        <div class="tag" onclick="selectTag(this, '🏀 Sports')">🏀 Sports</div>
      </div>

      <input id="title" placeholder="What's happening?">
      <input id="place" placeholder="Where is it?">
      <textarea id="description" placeholder="Add a short note or vibe check (optional)..." rows="2"></textarea>

      <div class="time-grid">
        <div>
          <label style="font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Start Time</label>
          <input type="datetime-local" id="startTime">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">End Time</label>
          <input type="datetime-local" id="endTime">
        </div>
      </div>

      <button onclick="addEvent()">Publish to Campus <i class='bx bx-send'></i></button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
